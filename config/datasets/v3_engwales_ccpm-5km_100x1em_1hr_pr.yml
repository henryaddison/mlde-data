scenario: rcp85
ensemble_members:
  - r001i1p00000
predictands:
  collection: land-cpm
  domain: engwales-5km
  resolution: 5km
  frequency: 1hr
  variables:
    - pr
  stats:
    time_aggregation_factors: [1,3,6,24] # pre-compute stats to include ones for 3hrly, 6hrly, and daily aggregations of the hourly data as well hourly
predictors:
  collection: land-cpm
  domain: engwales-5km
  resolution: 2.2km-coarsened-gcm
  frequency: day
  variables:
      - psl
split:
  scheme: random-season
  time_periods:
    - ["1980-12-01", "2000-11-30"]
    - ["2000-12-01", "2020-11-30"]
    - ["2020-12-01", "2040-11-30"]
    - ["2040-12-01", "2060-11-30"]
    - ["2060-12-01", "2080-11-30"]
  seed: 42
  props:
    train: 0.7
    val: 0.15
    test: 0.15
