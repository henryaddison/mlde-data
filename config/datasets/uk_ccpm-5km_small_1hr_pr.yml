scenario: rcp85
ensemble_members:
  - r001i1p00000
predictands:
  collection: land-cpm
  domain: uk
  resolution: 5km
  frequency: 1hr
  variables:
    - pr
  stats:
    time_aggregation_factors: [1,3,6,24] # pre-compute stats to include ones for 3hrly, 6hrly, and daily aggregations of the hourly data as well hourly
  spec:
    - action: trim-domain
      parameters:
        patch_size: 16
predictors:
  collection: land-cpm
  domain: uk
  resolution: 2.2km-coarsened-gcm
  frequency: day
  variables:
      - psl
      - spechum250
      - spechum500
      - spechum700
      - spechum850
      - temp250
      - temp500
      - temp700
      - temp850
      - vort250
      - vort500
      - vort700
      - vort850
split:
  scheme: random-season
  time_periods:
    - ["1980-12-01", "1990-11-30"]
  seed: 42
  props:
    train: 0.6
    val: 0.2
    test: 0.2
